<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅行攻略集 · Travel Notes</title>
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:linear-gradient(160deg,#FFF9F2 0%,#F7EFE3 100%); color:#3D3A36; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 20px;}
  .hero{text-align:center; margin-bottom:44px;}
  .hero .kicker{letter-spacing:4px; font-size:13px; color:#C4481F; font-weight:700; margin-bottom:12px;}
  .hero h1{font-size:34px; font-weight:800; letter-spacing:1px;}
  .hero .sub{margin-top:10px; font-size:14.5px; color:#8a8071;}
  .grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:22px; width:100%; max-width:760px;}
  .card{border-radius:20px; padding:30px 26px; text-decoration:none; display:block; transition:transform .18s ease, box-shadow .18s ease; box-shadow:0 8px 26px rgba(0,0,0,.07);}
  .card:hover{transform:translateY(-4px); box-shadow:0 14px 34px rgba(0,0,0,.12);}
  .card.on{background:#FFFFFF;}
  .card.soon{background:#FFFFFF; opacity:.55; cursor:default;}
  .card .ic{font-size:34px;}
  .card h2{font-size:21px; font-weight:800; margin-top:14px; color:#3D3A36;}
  .card p{font-size:13.5px; color:#9a8f7f; margin-top:8px; line-height:1.6;}
  .card .go{margin-top:18px; font-size:13px; font-weight:700; color:#E8562F; letter-spacing:1px;}
  .card.soon .go{color:#c9beb0;}
  footer{margin-top:48px; font-size:12px; color:#b3a896; letter-spacing:1px;}
</style>
</head>
<body>
  <div class="hero">
    <div class="kicker">TRAVEL NOTES</div>
    <h1>✈️ 旅行攻略集</h1>
    <div class="sub">自驾环线 · 深度攻略 · 个人整理</div>
  </div>

  <div class="grid">
    <a class="card on" href="./xinjiang/">
      <div class="ic">🏔️</div>
      <h2>新疆 · 反走北疆 + 伊犁大环线</h2>
      <p>2026 深秋 13 天自驾 · 4 人计划 · 喀纳斯 / 赛里木湖 / 独库公路</p>
      <div class="go">查看攻略 →</div>
    </a>

    <div class="card soon">
      <div class="ic">🇹🇷</div>
      <h2>土耳其 · 规划中</h2>
      <p>攻略整理中，敬请期待</p>
      <div class="go">敬请期待</div>
    </div>
  </div>

  <footer>JChengc · GitHub Pages</footer>
</body>
</html>
